# Kueue TAS Setup — uses EC2 API topology labels (topology.k8s.aws/network-node-layer-*)
#
# These labels are written natively by EKS cloud-provider (if IAM is correct)
# or by the label-nodes-from-ec2-topology.sh script.
#
# Customize:
#   - Replace <YOUR_INSTANCE_TYPE> with your GPU instance type
#   - Replace <YOUR_NAMESPACE> with your job namespace
#   - Adjust nominalQuota to match cluster capacity
---
apiVersion: kueue.x-k8s.io/v1beta2            # NOT v1alpha1
kind: Topology
metadata:
  name: ec2-network-topology
spec:
  levels:
    - nodeLabel: topology.k8s.aws/network-node-layer-1    # AZ fabric (widest)
    - nodeLabel: topology.k8s.aws/network-node-layer-2    # spine / block
    - nodeLabel: topology.k8s.aws/network-node-layer-3    # leaf / rack
    - nodeLabel: kubernetes.io/hostname                     # node (tightest)
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: gpu-tas-flavor
spec:
  nodeLabels:
    node.kubernetes.io/instance-type: <YOUR_INSTANCE_TYPE>   # e.g. p5.48xlarge, p3dn.24xlarge
  topologyName: ec2-network-topology
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: tas-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu", "vpc.amazonaws.com/efa"]
      flavors:
        - name: gpu-tas-flavor
          resources:
            - {name: "cpu", nominalQuota: "500"}
            - {name: "memory", nominalQuota: "4000Gi"}
            - {name: "nvidia.com/gpu", nominalQuota: "64"}
            - {name: "vpc.amazonaws.com/efa", nominalQuota: "128"}
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: tas-local-queue
  namespace: <YOUR_NAMESPACE>
spec:
  clusterQueue: tas-queue
