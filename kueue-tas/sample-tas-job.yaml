# Sample TAS Job — packs all pods onto one topology domain
#
# Customize:
#   - Replace <YOUR_NAMESPACE> with your job namespace
#   - Adjust the annotation level for desired placement:
#       kubernetes.io/hostname                        = same node
#       topology.k8s.aws/network-node-layer-3         = same rack
#       topology.k8s.aws/network-node-layer-2         = same block
#       topology.kubernetes.io/zone                   = same AZ
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tas-demo
  namespace: <YOUR_NAMESPACE>
  labels:
    kueue.x-k8s.io/queue-name: tas-local-queue
spec:
  parallelism: 3
  completions: 3
  suspend: true                                # REQUIRED
  backoffLimit: 0
  template:
    metadata:
      annotations:
        kueue.x-k8s.io/podset-required-topology: topology.k8s.aws/network-node-layer-3
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "echo TAS pod on $(hostname); sleep 10; echo done"]
          resources:
            requests:
              cpu: "1"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
