# Smoke Test — Proves MultiKueue dispatch without TAS
# Submit on the MANAGEMENT cluster. No topology annotation (TAS is worker-side).
#
# Customize:
#   - Replace <YOUR_NAMESPACE> with your job namespace
---
apiVersion: batch/v1
kind: Job
metadata:
  name: multicluster-smoke
  namespace: <YOUR_NAMESPACE>
  labels:
    kueue.x-k8s.io/queue-name: fleet-lq
spec:
  parallelism: 2
  completions: 2
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "echo 'MultiKueue dispatched to:' $(hostname); sleep 15; echo done"]
          resources:
            requests:
              cpu: "1"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
