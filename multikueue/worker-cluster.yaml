# MultiKueue — WORKER cluster (apply on EACH worker cluster that runs jobs)
#
# This is ONE parameterized template. Apply it on every worker, substituting
# that worker's own instance type and quota — do NOT keep a separate copy per
# worker. Each worker runs its own Kueue and enforces its own per-cluster quota.
# TAS is integrated: the ResourceFlavor binds to topology labels.
#
# HARD CONTRACT: LocalQueue NAME (fleet-lq) and NAMESPACE must match
# what the management cluster submits to.
#
# Customize per worker:
#   - Replace <YOUR_INSTANCE_TYPE> with THIS worker's GPU instance type
#   - Replace <YOUR_NAMESPACE> with your job namespace (same on every cluster)
#   - Set each nominalQuota to THIS worker's capacity (nodes x per-node amount);
#     a smaller worker gets smaller numbers, so the two workers are not identical
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: aws-network
spec:
  levels:
    - nodeLabel: topology.k8s.aws/network-node-layer-1
    - nodeLabel: topology.k8s.aws/network-node-layer-2
    - nodeLabel: topology.k8s.aws/network-node-layer-3
    - nodeLabel: kubernetes.io/hostname
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: gpu-worker-flavor
spec:
  nodeLabels:
    node.kubernetes.io/instance-type: <YOUR_INSTANCE_TYPE>   # e.g. p5.48xlarge
  topologyName: aws-network
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: worker-cq
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu", "vpc.amazonaws.com/efa"]
      flavors:
        - name: gpu-worker-flavor
          resources:
            - {name: "cpu", nominalQuota: "5000"}               # nodes x vCPU
            - {name: "memory", nominalQuota: "50000Gi"}         # nodes x memory
            - {name: "nvidia.com/gpu", nominalQuota: "232"}     # nodes x GPUs
            - {name: "vpc.amazonaws.com/efa", nominalQuota: "464"}  # nodes x EFA
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: fleet-lq
  namespace: <YOUR_NAMESPACE>                  # MUST match management cluster
spec:
  clusterQueue: worker-cq
